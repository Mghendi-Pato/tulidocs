# tuli (tulidocs.com) — nginx server block TEMPLATE.
# deploy/setup-server.sh fills in __DOMAINS__, __ROOT__ and __PORT__ and installs it as
# /etc/nginx/sites-available/tulidocs.com; certbot then adds the HTTPS (443) part.
# Serves the static frontend and proxies /api/ to the NestJS API on 127.0.0.1:__PORT__.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINS__;

    root __ROOT__;
    index index.html;

    # Pages (HTML) and their data files (index.txt) change with every deploy → browsers must check for a new
    # version each time (cheap: a 304 when nothing changed), so nobody keeps running an old build after an update.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
    }
    error_page 404 /404.html;

    # index.txt is the data the app loads when moving between pages — never a page itself. If a browser opens one
    # as a page (a restored tab, a search result, an old link), send it to the real page instead of showing raw text.
    location ~ ^(?<page>.*/)index\.txt$ {
        if ($http_sec_fetch_dest = "document") {
            return 302 $page;
        }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # API -> NestJS (pm2). The trailing slash strips /api:  /api/documents -> http://127.0.0.1:__PORT__/documents
    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF rendering can take a few seconds under load
        proxy_read_timeout 90s;
    }

    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/(templates|hero|images)/ {
        expires 7d;
    }

    # Logos travel as data URLs in JSON (API limit 2 MB)
    client_max_body_size 4m;
}
