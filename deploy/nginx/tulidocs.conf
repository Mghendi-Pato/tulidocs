# tuli (tulidocs.com) — nginx server block TEMPLATE.
# deploy/setup-server.sh fills in __DOMAINS__, __ROOT__ and __PORT__ and installs it as
# /etc/nginx/sites-available/tulidocs.com; certbot then adds the HTTPS (443) part.
# Serves the static frontend and proxies /api/ to the NestJS API on 127.0.0.1:__PORT__.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINS__;

    root __ROOT__;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;

    # API -> NestJS (pm2). The trailing slash strips /api:  /api/documents -> http://127.0.0.1:__PORT__/documents
    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF rendering can take a few seconds under load
        proxy_read_timeout 90s;
    }

    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/(templates|hero|images)/ {
        expires 7d;
    }

    # Logos travel as data URLs in JSON (API limit 2 MB)
    client_max_body_size 4m;
}
