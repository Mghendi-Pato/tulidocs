# tuli — nginx server block
# Place at /etc/nginx/sites-available/tulidocs.com and symlink into sites-enabled.
# Serves the built frontend (static export) and proxies /api to the NestJS app on 127.0.0.1:4400.
# Then: certbot --nginx -d tulidocs.com -d www.tulidocs.com

server {
    listen 80;
    listen [::]:80;
    server_name tulidocs.com www.tulidocs.com;

    root /var/www/nubian-invoices;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;

    # API -> NestJS (pm2). The trailing slash strips /api:  /api/documents -> http://127.0.0.1:4400/documents
    location /api/ {
        proxy_pass http://127.0.0.1:4400/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF rendering can take a few seconds under load
        proxy_read_timeout 90s;
    }

    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location /templates/ {
        expires 7d;
    }

    # Logos travel as data URLs in JSON (API limit 2 MB)
    client_max_body_size 4m;
}
